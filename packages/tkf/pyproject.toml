[project]
name = "tkf"
version = "0.1.0"
description = "Tiny Kubeflow: Lightweight Kubernetes-native DAG pipeline engine"
readme = "README.md"
authors = [
    { name = "Tore Erdmann", email = "tore.erdmann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=28.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "kopf>=1.37.0",
]

[project.scripts]
tkf = "tkf.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
