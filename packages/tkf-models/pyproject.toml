[project]
name = "tkf-models"
version = "0.1.0"
description = "High-level ML, Time Series, and Reconciliation Modeling layer for tkf"
readme = "README.md"
authors = [
    { name = "Tore Erdmann", email = "tore.erdmann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tkf",
    "scikit-learn>=1.5.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
