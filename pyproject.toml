[project]
name = "tkf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tore Erdmann", email = "tore.erdmann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kopf>=1.37.0",
    "kubernetes>=28.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
tkf = "tkf:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
