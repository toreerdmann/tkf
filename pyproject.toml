[project]
name = "tkf-workspace"
version = "0.1.0"
description = "Monorepo for tkf (Tiny Kubeflow) and tkf-models"
readme = "README.md"
authors = [
    { name = "Tore Erdmann", email = "tore.erdmann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tkf",
    "tkf-models",
    "altair>=6.2.2",
    "marimo>=0.24.0",
    "matplotlib>=3.10.0",
    "optuna>=4.0.0",
    "tweepy>=4.14.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tkf = { workspace = true }
tkf-models = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
