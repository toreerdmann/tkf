apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelineruns.tkf.dev
spec:
  group: tkf.dev
  names:
    kind: PipelineRun
    listKind: PipelineRunList
    plural: pipelineruns
    singular: pipelinerun
    shortNames:
      - pr
      - tkfrun
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tasks
              properties:
                volume:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    name:
                      type: string
                    size:
                      type: string
                    mountPath:
                      type: string
                    temp:
                      type: boolean
                    storageClass:
                      type: string
                tasks:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - image
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                      args:
                        type: array
                        items:
                          type: string
                      dependsOn:
                        type: array
                        items:
                          type: string
                      env:
                        type: object
                        additionalProperties:
                          type: string
                      cpu:
                        type: string
                      memory:
                        type: string
                      gpu:
                        type: integer
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                message:
                  type: string
                startTime:
                  type: string
                completionTime:
                  type: string
                pvcName:
                  type: string
                tasks:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      phase:
                        type: string
                      jobName:
                        type: string
                      podName:
                        type: string
                      startTime:
                        type: string
                      completionTime:
                        type: string
                      exitCode:
                        type: integer
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PVC
          type: string
          jsonPath: .status.pvcName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
